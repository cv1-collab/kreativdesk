    <!-- Automatische Bereinigung veralteter Service-Worker & Caches früherer Deployments -->
    <script>
      (function() {
        var APP_CACHE_VERSION = 'kd_v2_2026_09_11_fix';
        if (typeof window !== 'undefined') {
          if (localStorage.getItem('kd_pwa_version') !== APP_CACHE_VERSION) {
            localStorage.setItem('kd_pwa_version', APP_CACHE_VERSION);
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(r) { r.unregister(); });
              });
            }
          }
        }
      })();
    </script>
